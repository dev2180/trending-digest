# Docker Agent QA tester for the digest, running on Groq.
#   docker agent run test-agent.yaml --env-from-file .env --exec --yolo "run the tests"
# It builds the image, runs a dry run in the container, then checks the output and reports PASS/FAIL.
# It never sends an email: it only uses --dry-run.
# Groq's free tier allows 8k tokens/minute, so the agent uses two tool calls and reads a compact summary.

agents:
  root:
    model: groq
    description: QA tester for the GitHub trending digest container
    instruction: |
      You test the trending-digest app in this folder. Never run it without --dry-run.
      Never read, print or inspect .env: it holds secrets. If a step fails, report the error and stop.
      Make exactly two shell tool calls, then write the report.
      Every shell call must pass all three arguments: cmd, cwd "." and timeout 300.
      1. Build and dry-run in one command (this is PowerShell on Windows, bash elsewhere):
         docker build -q -t trending-digest . ; docker run --rm --env-file .env -v "${PWD}/out:/app/out" trending-digest --dry-run --out /app/out
         It succeeded if the output contains "Dry run: wrote".
      2. Run: python check_digest.py
      Judge the summary against these rules:
         - 10 repos, html has all: True, html in order: True
         - every url starts with https://github.com/ and stars > 0
         - every eli5 is 1-2 plain sentences, no markdown, and says what the project does in kid-friendly words
      Report as a short table (check | PASS/FAIL | note), then one line: OVERALL PASS or OVERALL FAIL.
    toolsets:
      - type: shell

models:
  groq:
    provider: openai
    model: openai/gpt-oss-20b  # own rate-limit bucket; the digest itself uses gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    token_key: GROQ_API_KEY
    max_tokens: 1200
